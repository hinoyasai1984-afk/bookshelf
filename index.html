<!doctype html>
<html lang="ja">
<head>

<meta name="theme-color" content="#7A5323" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<div class="page">

  <a class="back-link" href="https://hinoyasai1984-afk.github.io/">← アプリ一覧に戻る</a>
